[workspace]
resolver = "3"
members = ["crates/shared", "crates/edge-client", "crates/middleware"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

# Dependencies used by more than one crate. Member crates reference them with
# `.workspace = true` so the versions stay in sync.
[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

edge-shared = { path = "crates/shared" }
